<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'">
<title>Monthly Markdown Calendar · 本地预览</title>
<link rel="stylesheet" href="/host.css">
<link rel="stylesheet" href="/styles.css">
<body class="theme-light">
<div class="preview-banner">
  <span>插件界面预览 · 使用同一份视图代码，Obsidian 宿主 API 为测试替身</span>
  <div><button id="theme">切换深浅色</button><button id="toggle-editor">测试文件更新</button><button id="restore">恢复标签页</button></div>
</div>
<main class="workspace">
  <div class="workspace-tab"><span>▦</span> 月度日历 <span class="tab-note">本地 Markdown</span></div>
  <div id="calendar"></div>
</main>
<p id="opened" role="status"></p>
<section id="editor" hidden>
  <label for="source">测试用月度 Markdown（仅在内存中模拟文件，不写入 vault）</label>
  <textarea id="source" spellcheck="false"></textarea>
  <button id="apply-edit">模拟文件保存并刷新</button>
</section>
<script type="module" src="/preview.js"></script>
</body>
</html>
